[project]
name = "geometor-feuerbach"
dynamic = ["version"]
authors = [
  { name = "geometor", email = "github@geometor.com" },
]
description = "Multi-treatise bilingual Book Codex and exact symbolic SymPy + geometor.model demonstrations uniting Euler (1765/1767, E325) and Feuerbach (1822)."
readme = "README.rst"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sympy",
    "rich",
    "geometor-model",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
feuerbach = "geometor.feuerbach.__main__:main"

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geometor"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "geometor.feuerbach.__version__"}

[project.urls]
"Website" = "https://geometor.github.io/feuerbach"
"Repository" = "https://github.com/geometor/feuerbach"
"Issues" = "https://github.com/geometor/feuerbach/issues"

[tool.ruff]
lint.select = ["E", "F", "I", "ANN", "D"]
lint.ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
